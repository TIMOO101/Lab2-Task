name: CI Push Workflow

on: [push]

jobs:
  first_job:
    name: First Stage Task
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Step 1
        run: |
          echo "Starting First Job..."
          echo "Processing files..."

  second_job:
    name: Second Stage Task
    runs-on: ubuntu-latest
    needs: first_job
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Execute Step 2
        run: |
          echo "First Job completed successfully!"
          echo "Running Second Job now..."